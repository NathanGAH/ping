<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Me</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 380px;
    }
    h2 { margin-top: 0; text-align: center; }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 15px;
      box-sizing: border-box;
    }
    select, input { background: #2a2a2a; color: white; }
    button {
      background: #5865F2;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #4752C4; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 8px; font-size: 13px; text-align: center; min-height: 18px; }
    
    /* Live Chat Feed */
    .chat-box {
      margin-top: 16px;
      border-top: 1px solid #333;
      padding-top: 12px;
    }
    .chat-header {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    #messages {
      background: #141414;
      border-radius: 8px;
      padding: 10px;
      height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .msg.friend { background: #2b2d31; align-self: flex-end; color: #e0e0e0; }
    .msg.you { background: #5865F2; align-self: flex-start; color: #fff; }
    .msg-time { font-size: 10px; opacity: 0.7; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ping</h2>
    <select id="gameSelect">
      <option value="Fortnite">Fortnite</option>
      <option value="Geometry Dash">Geometry Dash</option>
      <option value="Scratch / Coding">Scratch / Coding</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="noteInput" placeholder="Message or note..." maxlength="120">
    <button id="pingBtn" onclick="sendPing()">Send Ping / Message</button>
    <div id="status"></div>

    <div class="chat-box">
      <div class="chat-header">
        <span>Chat Fees</span>
        <span id="connStatus">Connecting...</span>
      </div>
      <div id="messages"></div>
    </div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR EXACT NTFY TOPIC NAME
    const TOPIC = "nathanpingalert8888";
    const messagesDiv = document.getElementById("messages");

    // 1. Listen for incoming messages in real-time (including last 12 hours of history)
    const eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse?since=12h`);

    eventSource.onopen = () => {
      document.getElementById("connStatus").textContent = "Live";
    };

    eventSource.onerror = () => {
      document.getElementById("connStatus").textContent = "Reconnecting...";
    };

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.event !== "message") return;

      // Distinguish between pings sent from this webpage vs replies sent from your phone/PC
      const isFromWeb = data.tags && data.tags.includes("web_ping");
      appendMessage(data.message, isFromWeb ? "friend" : "you", data.time);
    };

    function appendMessage(text, sender, timestamp) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      const timeStr = new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const label = sender === "friend" ? "You" : "Nathan";
      div.innerHTML = `<strong>${label}:</strong> ${escapeHTML(text)}<span class="msg-time">${timeStr}</span>`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    // 2. Send a ping/message from the webpage
    async function sendPing() {
      const btn = document.getElementById("pingBtn");
      const status = document.getElementById("status");
      const game = document.getElementById("gameSelect").value;
      const noteInput = document.getElementById("noteInput");
      const note = noteInput.value.trim();

      btn.disabled = true;
      status.textContent = "Sending...";

      const message = note ? `[${game}] ${note}` : `Hop on ${game}!`;

      try {
        const response = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: message,
          headers: {
            "Title": "Friend Ping",
            "Priority": "high",
            "Tags": "video_game,web_ping"
          }
        });

        if (response.ok) {
          noteInput.value = "";
          status.textContent = "Sent!";
          status.style.color = "#4ade80";
          setTimeout(() => { btn.disabled = false; status.textContent = ""; }, 5000); // 5s cooldown for chatting
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        status.textContent = "Failed to send.";
        status.style.color = "#f87171";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
