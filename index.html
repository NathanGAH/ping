<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Ping Chat</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      /* Clean responsive sizing using clamp */
      width: clamp(320px, 92vw, 1100px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }

    #chatScreen { 
      display: none; 
      flex-direction: column; 
      gap: 12px; 
      flex: 1;
      overflow: hidden;
    }

    .header {
      flex-shrink: 0;
    }

    #messages {
      background: #141414;
      border-radius: 10px;
      padding: 12px;
      /* Stretches and scrolls properly without overflowing */
      flex: 1; 
      min-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }
    .header h2 { margin: 0; font-size: 18px; }
    #connStatus { font-size: 12px; color: #aaa; }
    
    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
      flex-shrink: 0;
    }
    .msg.friend { background: #2b2d31; align-self: flex-end; color: #e0e0e0; border-bottom-right-radius: 4px; }
    .msg.you { background: #5865F2; align-self: flex-start; color: #fff; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; opacity: 0.7; display: block; margin-top: 4px; }

    .input-row { display: flex; gap: 8px; flex-shrink: 0; }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #5865F2; }
    button {
      padding: 0 18px;
      border-radius: 8px;
      background: #5865F2;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #4752C4; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { font-size: 12px; text-align: center; min-height: 16px; margin-top: -6px; flex-shrink: 0; }

    #setupScreen { display: none; flex-direction: column; gap: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Setup Screen (Only shown if he somehow opens it with no secret code) -->
    <div id="setupScreen">
      <h2>🔒 Enter Secret Room Code</h2>
      <p style="font-size: 13px; color: #aaa; margin: 0;">Enter your shared secret code to connect.</p>
      <input type="password" id="roomInput" placeholder="Secret code..." autocomplete="off">
      <button onclick="saveAndJoin(document.getElementById('roomInput').value)">Enter Chat</button>
    </div>

    <!-- Main Chat Screen -->
    <div id="chatScreen">
      <div class="header">
        <h2>💬 Secure Ping Chat</h2>
        <span id="connStatus">🟡 Connecting...</span>
      </div>

      <div id="messages"></div>

      <div class="input-row">
        <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
        <button type="button" onclick="document.getElementById('fileInput').click()" title="Send File" style="padding: 0 12px; background: #2b2d31;">📎</button>
        <input type="text" id="msgInput" placeholder="Type a message & press Enter..." maxlength="200" autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    let TOPIC = "";
    let eventSource = null;
    const chimeSound = new Audio("send.wav");

    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");
    let isSending = false;

    // Track processed message IDs and clear timestamps to prevent reload glitches
    const executedIds = new Set(JSON.parse(localStorage.getItem("ping_executed_ids") || "[]"));

    function markAsExecuted(id) {
      executedIds.add(id);
      const arr = Array.from(executedIds).slice(-100); // Keep last 100 IDs
      localStorage.setItem("ping_executed_ids", JSON.stringify(arr));
    }

    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Auto-load on page start
    window.addEventListener("DOMContentLoaded", async () => {
      let code = window.location.hash.substring(1).trim();

      if (code) {
        localStorage.setItem("ping_room_code", code);
      } else {
        code = localStorage.getItem("ping_room_code");
      }

      if (code) {
        TOPIC = await hashString(code);
        document.getElementById("chatScreen").style.display = "flex";
        msgInput.focus();
        initChat();
      } else {
        document.getElementById("setupScreen").style.display = "flex";
      }
    });

    async function saveAndJoin(code) {
      code = code.trim();
      if (!code) return;
      localStorage.setItem("ping_room_code", code);
      TOPIC = await hashString(code);
      document.getElementById("setupScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";
      msgInput.focus();
      initChat();
    }

    document.getElementById("roomInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveAndJoin(e.target.value);
    });

    msgInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function initChat() {
      eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse?since=12h`);

      eventSource.onopen = () => {
        document.getElementById("connStatus").textContent = "🟢 Live";
      };

      eventSource.onerror = () => {
        document.getElementById("connStatus").textContent = "🔴 Reconnecting...";
      };

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.event !== "message") return;

        const isFromWeb = data.tags && data.tags.includes("web_ping");
        const text = data.message;
        const alreadyProcessed = executedIds.has(data.id);

        // 1. Instantly drop any messages older than the last clear command (prevents flashing on reload)
        const lastClearTime = Number(localStorage.getItem("ping_clear_time") || 0);
        if (data.time <= lastClearTime) {
          return;
        }

        // 2. Handle incoming commands from your end
        if (!isFromWeb) {
          if (text.startsWith("/commands ")) {
            const cmd = text.replace("/commands ", "").trim().toLowerCase();
            if (cmd === "clear") {
              localStorage.setItem("ping_clear_time", data.time);
              messagesDiv.innerHTML = "";
              return;
            } else if (cmd === "notify") {
              if (!alreadyProcessed) {
                markAsExecuted(data.id);
                chimeSound.play().catch(() => {});
                if (Notification.permission === "granted") {
                  new Notification("Ping Chat", { body: "New alert from Nathan!" });
                }
              }
              return;
            }
          }
          
          // Play sound for standard messages only if not already processed on reload
          if (!alreadyProcessed) {
            markAsExecuted(data.id);
            chimeSound.play().catch(e => {});
          }
        }

        appendMessage(text, isFromWeb ? "friend" : "you", data.time, data.attachment);
      };
    }

    function appendMessage(text, sender, timestamp, attachment = null) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      const timeStr = new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const label = sender === "friend" ? "You" : "Nathan";
      
      let contentHTML = `<strong>${label}:</strong> `;
      if (text) {
        contentHTML += escapeHTML(text);
      }

      if (attachment && attachment.url) {
        const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(attachment.name);
        if (isImage) {
          contentHTML += `<br><a href="${attachment.url}" target="_blank"><img src="${attachment.url}" style="max-width: 100%; border-radius: 8px; margin-top: 6px; max-height: 220px;"></a>`;
        } else {
          contentHTML += `<br><a href="${attachment.url}" target="_blank" style="color: #93c5fd; text-decoration: underline; display: inline-block; margin-top: 4px;">📎 ${escapeHTML(attachment.name)}</a>`;
        }
      }

      contentHTML += `<span class="msg-time">${timeStr}</span>`;
      div.innerHTML = contentHTML;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        statusDiv.textContent = "❌ File must be under 15MB.";
        statusDiv.style.color = "#f87171";
        fileInput.value = "";
        return;
      }

      statusDiv.textContent = `⏳ Uploading ${file.name}...`;
      statusDiv.style.color = "#aaa";
      sendBtn.disabled = true;

      try {
        const response = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "PUT",
          body: file,
          headers: {
            "Filename": file.name,
            "Tags": "paperclip,web_ping"
          }
        });

        if (response.ok) {
          statusDiv.textContent = "";
        } else {
          throw new Error("Upload failed");
        }
      } catch (err) {
        statusDiv.textContent = "❌ Failed to upload file.";
        statusDiv.style.color = "#f87171";
      } finally {
        fileInput.value = "";
        sendBtn.disabled = false;
      }
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || isSending) return;

      isSending = true;
      sendBtn.disabled = true;
      statusDiv.textContent = "";

      if (Notification.permission === "default") {
        Notification.requestPermission();
      }

      try {
        const response = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: text,
          headers: {
            "Title": "Friend Message",
            "Priority": "high",
            "Tags": "speech_balloon,web_ping"
          }
        });

        if (response.ok) {
          msgInput.value = "";
          msgInput.focus();
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        statusDiv.textContent = "❌ Failed to send.";
        statusDiv.style.color = "#f87171";
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
