<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Chat</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .header h2 { margin: 0; font-size: 18px; }
    #connStatus { font-size: 12px; color: #aaa; }
    
    #messages {
      background: #141414;
      border-radius: 10px;
      padding: 12px;
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .msg.friend { background: #2b2d31; align-self: flex-end; color: #e0e0e0; border-bottom-right-radius: 4px; }
    .msg.you { background: #5865F2; align-self: flex-start; color: #fff; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; opacity: 0.7; display: block; margin-top: 4px; }

    .input-row {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #5865F2; }
    button {
      padding: 0 18px;
      border-radius: 8px;
      background: #5865F2;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #4752C4; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { font-size: 12px; text-align: center; min-height: 16px; margin-top: -6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>💬 Ping Chat</h2>
      <span id="connStatus">🟡 Connecting...</span>
    </div>

    <div id="messages"></div>

    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Type a message & press Enter..." maxlength="200" autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR EXACT NTFY TOPIC NAME
    const TOPIC = "nathanpingalert8888";
    
    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");
    let isSending = false;

    // Trigger send when pressing Enter
    msgInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // Listen for incoming messages in real-time
    const eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse?since=12h`);

    eventSource.onopen = () => {
      document.getElementById("connStatus").textContent = "🟢 Live";
    };

    eventSource.onerror = () => {
      document.getElementById("connStatus").textContent = "🔴 Reconnecting...";
    };

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.event !== "message") return;

      const isFromWeb = data.tags && data.tags.includes("web_ping");
      appendMessage(data.message, isFromWeb ? "friend" : "you", data.time);
    };

    function appendMessage(text, sender, timestamp) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      const timeStr = new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const label = sender === "friend" ? "You" : "Nathan";
      div.innerHTML = `<strong>${label}:</strong> ${escapeHTML(text)}<span class="msg-time">${timeStr}</span>`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || isSending) return;

      isSending = true;
      sendBtn.disabled = true;
      statusDiv.textContent = "";

      try {
        const response = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: text,
          headers: {
            "Title": "Friend Message",
            "Priority": "high",
            "Tags": "speech_balloon,web_ping"
          }
        });

        if (response.ok) {
          msgInput.value = "";
          msgInput.focus();
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        statusDiv.textContent = "❌ Failed to send. Check connection.";
        statusDiv.style.color = "#f87171";
      } finally {
        isSending = false;
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
