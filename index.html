<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Me</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      text-align: center;
      width: 90%;
      max-width: 340px;
    }
    h2 { margin-top: 0; }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 16px;
      box-sizing: border-box;
    }
    select, input {
      background: #2a2a2a;
      color: white;
    }
    button {
      background: #5865F2;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4752C4; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ping.</h2></h2>
    <select id="gameSelect">
      <option value="Fortnite">Fortnite</option>
      <option value="Geometry Dash">Geometry Dash</option>
      <option value="Scratch / Coding">Scratch / Coding</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="noteInput" placeholder="Optional note (e.g. 'on for 30 mins')" maxlength="80">
    <button id="pingBtn" onclick="sendPing()">Send Ping 🚀</button>
    <div id="status"></div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR EXACT NTFY TOPIC NAME
    const TOPIC = "nathanpingalert8888";

    async function sendPing() {
      const btn = document.getElementById("pingBtn");
      const status = document.getElementById("status");
      const game = document.getElementById("gameSelect").value;
      const note = document.getElementById("noteInput").value.trim();

      btn.disabled = true;
      status.textContent = "Sending...";
      status.style.color = "#aaa";

      const message = note 
        ? `Yo! Get on ${game} — "${note}"` 
        : `Yo! Your friend is online and wants to play ${game}!`;

      try {
        const response = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: message,
          headers: {
            "Title": "Friend is Online!",
            "Priority": "high",
            "Tags": "video_game,bell"
          }
        });

        if (response.ok) {
          status.textContent = "✅ Ping sent! Wait 60s before pinging again.";
          status.style.color = "#4ade80";
          setTimeout(() => { btn.disabled = false; }, 60000); // 1-min cooldown so he can't spam you
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        status.textContent = "❌ Failed to send. Check connection.";
        status.style.color = "#f87171";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
